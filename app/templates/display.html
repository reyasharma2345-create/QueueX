<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QueueX - Branch Display Board</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #e2e8f0;
            min-height: 100vh;
        }
        .display-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 1.5rem;
            padding: 1.5rem;
            max-width: 100%;
        }
        .queue-panel {
            background: rgba(30, 41, 59, 0.95);
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 1rem;
            padding: 1.5rem;
            backdrop-filter: blur(10px);
        }
        .queue-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid rgba(148, 163, 184, 0.2);
        }
        .queue-name {
            font-size: 1.25rem;
            font-weight: 700;
            color: #f1f5f9;
        }
        .queue-service {
            font-size: 0.875rem;
            color: #94a3b8;
            text-transform: capitalize;
        }
        .current-token {
            display: flex;
            align-items: baseline;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }
        .current-label {
            font-size: 0.875rem;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .current-number {
            font-size: 4rem;
            font-weight: 800;
            color: #22d3ee;
            font-variant-numeric: tabular-nums;
            line-height: 1;
            text-shadow: 0 0 30px rgba(34, 211, 238, 0.5);
        }
        .current-serving {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            background: rgba(34, 197, 94, 0.15);
            border: 1px solid rgba(34, 197, 94, 0.3);
            border-radius: 0.5rem;
            color: #22c55e;
            font-weight: 600;
        }
        .waiting-list {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        .waiting-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.75rem 1rem;
            background: rgba(51, 65, 85, 0.5);
            border: 1px solid rgba(148, 163, 184, 0.1);
            border-radius: 0.5rem;
            transition: all 0.2s ease;
        }
        .waiting-item.called {
            background: rgba(249, 115, 22, 0.15);
            border-color: rgba(249, 115, 22, 0.3);
        }
        .waiting-item.serving {
            background: rgba(34, 197, 94, 0.15);
            border-color: rgba(34, 197, 94, 0.3);
        }
        .waiting-token {
            font-size: 1.5rem;
            font-weight: 700;
            color: #f1f5f9;
            font-variant-numeric: tabular-nums;
        }
        .waiting-meta {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 0.25rem;
        }
        .waiting-status {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-weight: 600;
        }
        .waiting-status.waiting { color: #22d3ee; }
        .waiting-status.called { color: #f97316; }
        .waiting-status.serving { color: #22c55e; }
        .waiting-counter {
            font-size: 0.75rem;
            color: #94a3b8;
        }
        .waiting-people-ahead {
            font-size: 0.75rem;
            color: #64748b;
        }
        .branch-info {
            position: fixed;
            top: 1rem;
            left: 1rem;
            right: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
        }
        .branch-name-display {
            font-size: 1.5rem;
            font-weight: 700;
            color: #f1f5f9;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }
        .branch-time {
            font-size: 1.25rem;
            font-weight: 600;
            color: #94a3b8;
            font-variant-numeric: tabular-nums;
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
        }
        .empty-state {
            text-align: center;
            padding: 3rem;
            color: #64748b;
        }
        .empty-state svg {
            width: 48px;
            height: 48px;
            margin-bottom: 1rem;
            opacity: 0.5;
        }
        .empty-state p {
            font-size: 1rem;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .called .current-number {
            animation: pulse 1s infinite;
        }
        .no-queues {
            grid-column: 1 / -1;
            text-align: center;
            padding: 3rem;
            color: #64748b;
        }
        @media (max-width: 768px) {
            .display-container {
                grid-template-columns: 1fr;
                padding: 1rem;
            }
            .branch-info {
                flex-direction: column;
                gap: 0.5rem;
                text-align: center;
            }
            .current-number {
                font-size: 3rem;
            }
        }
    </style>
</head>
<body>
    <div class="branch-info">
        <div class="branch-name-display" id="branchName">Loading...</div>
        <div class="branch-time" id="currentTime">--:--:--</div>
    </div>

    <div class="display-container" id="queuesContainer">
        <div class="no-queues">Loading queues...</div>
    </div>

    <script>
        let branchId = null;
        let updateInterval = null;

        async function fetchDisplayData() {
            try {
                const response = await fetch('/api/display/branch');
                if (!response.ok) throw new Error('Failed to fetch');
                const data = await response.json();
                renderDisplay(data);
            } catch (error) {
                console.error('Display fetch error:', error);
            }
        }

        function renderDisplay(data) {
            if (!branchId) {
                branchId = data.branch_id;
                document.getElementById('branchName').textContent = data.branch_name;
            }

            const container = document.getElementById('queuesContainer');
            
            if (!data.queues || data.queues.length === 0) {
                container.innerHTML = '<div class="no-queues">No active queues at this branch</div>';
                return;
            }

            container.innerHTML = data.queues.map(queue => `
                <div class="queue-panel">
                    <div class="queue-header">
                        <div>
                            <div class="queue-name">${escapeHtml(queue.name)}</div>
                            <div class="queue-service">${escapeHtml(queue.service_name)}</div>
                        </div>
                    </div>
                    
                    ${queue.current_token ? `
                        <div class="current-token ${queue.current_token.status === 'called' ? 'called' : ''}">
                            <span class="current-label">Now Serving</span>
                            <span class="current-number">${queue.current_token.token_number}</span>
                            ${queue.current_token.counter_name ? `
                                <span class="current-serving">Counter ${queue.current_token.counter_name}</span>
                            ` : ''}
                        </div>
                    ` : `
                        <div class="empty-state">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                                <circle cx="12" cy="12" r="10"/>
                                <line x1="12" y1="8" x2="12" y2="16"/>
                                <line x1="8" y1="12" x2="16" y2="12"/>
                            </svg>
                            <p>No token currently being served</p>
                        </div>
                    `}

                    <div class="waiting-list">
                        ${queue.waiting_tokens.length > 0 ? queue.waiting_tokens.map((token, index) => `
                            <div class="waiting-item ${token.status}">
                                <span class="waiting-token">${token.token_number}</span>
                                <div class="waiting-meta">
                                    <span class="waiting-status ${token.status}">${token.status}</span>
                                    ${token.counter_name ? `<span class="waiting-counter">Counter ${token.counter_name}</span>` : ''}
                                    ${token.status === 'waiting' ? `<span class="waiting-people-ahead">${index + 1} person${index > 0 ? 's' : ''} ahead</span>` : ''}
                                </div>
                            </div>
                        `).join('') : `
                            <div class="empty-state">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                                    <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                                    <circle cx="9" cy="7" r="4"/>
                                    <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
                                    <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                                </svg>
                                <p>No waiting tokens</p>
                            </div>
                        `}
                    </div>
                </div>
            `).join('');
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function updateTime() {
            const now = new Date();
            document.getElementById('currentTime').textContent = now.toLocaleTimeString('en-US', { 
                hour12: false, 
                hour: '2-digit', 
                minute: '2-digit', 
                second: '2-digit' 
            });
        }

        // Initialize
        updateTime();
        setInterval(updateTime, 1000);
        fetchDisplayData();
        updateInterval = setInterval(fetchDisplayData, 2000);

        // Cleanup on page unload
        window.addEventListener('beforeunload', () => {
            if (updateInterval) clearInterval(updateInterval);
        });
    </script>
</body>
</html>
