<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Get Your Token - QueueX</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                Roboto, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 40px auto;
        }

        .header {
            background: #2563eb;
            color: white;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 24px;
        }

        .header h1 {
            font-size: 30px;
        }

        .header p {
            margin-top: 6px;
            opacity: 0.9;
        }

        .card {
            background: white;
            padding: 24px;
            border-radius: 10px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.1);
        }

        .field {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: 600;
            color: #374151;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 15px;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #2563eb;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        button:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }

        .message {
            margin-top: 18px;
            padding: 15px;
            border-radius: 6px;
            display: none;
            text-align: center;
        }

        .success {
            display: block;
            background: #d1fae5;
            color: #065f46;
        }

        .error {
            display: block;
            background: #fee2e2;
            color: #991b1b;
        }

        .token-result {
            margin-top: 20px;
            padding: 25px;
            background: #eff6ff;
            border-radius: 8px;
            text-align: center;
            display: none;
        }

        .token-result h2 {
            color: #1e40af;
            margin-bottom: 8px;
        }

        .token-number {
            font-size: 60px;
            font-weight: 700;
            color: #2563eb;
            margin-bottom: 8px;
        }

        .customer-name {
            font-size: 18px;
            font-weight: 600;
            color: #374151;
            margin-bottom: 5px;
        }

        .queue-name {
            font-size: 15px;
            color: #6b7280;
            margin-bottom: 15px;
        }

        .queue-info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 20px;
        }

        .info-box {
            background: white;
            padding: 15px;
            border-radius: 8px;
        }

        .info-value {
            font-size: 24px;
            font-weight: 700;
            color: #2563eb;
        }

        .info-label {
            margin-top: 4px;
            font-size: 13px;
            color: #6b7280;
        }

        .status {
            margin-top: 18px;
            padding: 10px;
            background: #fef3c7;
            color: #92400e;
            border-radius: 6px;
            font-weight: 600;
        }

        .status.called {
            background: #dbeafe;
            color: #1e40af;
        }

        .status.serving {
            background: #d1fae5;
            color: #065f46;
        }

        .status.completed {
            background: #e5e7eb;
            color: #374151;
        }

        .status.no-show {
            background: #fee2e2;
            color: #991b1b;
        }

        .live {
            margin-top: 12px;
            font-size: 13px;
            color: #6b7280;
        }

        .new-token {
            margin-top: 15px;
            background: #6b7280;
        }

        .new-token:hover {
            background: #4b5563;
        }

        .back {
            display: block;
            margin-top: 20px;
            text-align: center;
            color: #2563eb;
            text-decoration: none;
        }

        .back:hover {
            text-decoration: underline;
        }

        @media (max-width: 500px) {
            .queue-info {
                grid-template-columns: 1fr;
            }

            .container {
                margin: 20px auto;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- HEADER -->
        <div class="header">
            <h1>QueueX</h1>
            <p>Get Your Queue Token</p>
        </div>

        <div class="card">

            <!-- TOKEN FORM -->
            <form id="token-form">

                <div class="field">
                    <label for="name">Full Name</label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your full name"
                        required
                    >
                </div>

                <div class="field">
                    <label for="phone">Phone Number</label>

                    <input
                        type="tel"
                        id="phone"
                        placeholder="Enter your phone number"
                        required
                    >
                </div>

                <div class="field">
                    <label for="queue">Select Service Queue</label>

                    <select id="queue" required>
                        <option value="">
                            Loading queues...
                        </option>
                    </select>
                </div>

                <button
                    type="submit"
                    id="submit-btn"
                >
                    Get Token
                </button>

            </form>

            <!-- MESSAGE -->
            <div
                id="message"
                class="message"
            ></div>

            <!-- TOKEN RESULT -->
            <div
                id="token-result"
                class="token-result"
            >

                <h2>Your Token Number</h2>

                <div
                    id="token-number"
                    class="token-number"
                >
                    --
                </div>

                <div
                    id="customer-name"
                    class="customer-name"
                ></div>

                <div
                    id="queue-name"
                    class="queue-name"
                ></div>

                <!-- QUEUE INFO -->
                <div class="queue-info">

                    <div class="info-box">

                        <div
                            id="people-ahead"
                            class="info-value"
                        >
                            --
                        </div>

                        <div class="info-label">
                            People Ahead
                        </div>

                    </div>

                    <div class="info-box">

                        <div
                            id="estimated-wait"
                            class="info-value"
                        >
                            --
                        </div>

                        <div class="info-label">
                            Est. Wait (min)
                        </div>

                    </div>

                </div>

                <!-- STATUS -->
                <div
                    id="queue-status"
                    class="status"
                >
                    WAITING
                </div>

                <div class="live">
                    Live updates every 2 seconds
                </div>

                <!-- NEW TOKEN -->
                <button
                    type="button"
                    id="new-token-btn"
                    class="new-token"
                >
                    Get Another Token
                </button>

            </div>

        </div>

        <a
            href="/"
            class="back"
        >
            ← Back to Dashboard
        </a>

    </div>


<script>

    // ==========================================
    // CURRENT TOKEN
    // ==========================================

    let currentTokenId = null;
    let currentQueueId = null;
    let currentTokenNumber = null;
    let currentCustomerName = null;
    let currentQueueName = null;

    let liveUpdateInterval = null;


    // ==========================================
    // SAVE TOKEN
    // ==========================================

    function saveToken() {

        const tokenInfo = {
            token_id: currentTokenId,
            queue_id: currentQueueId,
            token_number: currentTokenNumber,
            customer_name: currentCustomerName,
            queue_name: currentQueueName
        };

        localStorage.setItem(
            "queuex_current_token",
            JSON.stringify(tokenInfo)
        );
    }


    // ==========================================
    // CLEAR SAVED TOKEN
    // ==========================================

    function clearSavedToken() {

        localStorage.removeItem(
            "queuex_current_token"
        );
    }


    // ==========================================
    // LOAD SAVED TOKEN
    // ==========================================

    function loadSavedToken() {

        const saved =
            localStorage.getItem(
                "queuex_current_token"
            );

        if (!saved) {
            return false;
        }

        try {

            const tokenInfo =
                JSON.parse(saved);

            if (
                !tokenInfo.token_id ||
                !tokenInfo.queue_id
            ) {
                clearSavedToken();
                return false;
            }

            currentTokenId =
                Number(tokenInfo.token_id);

            currentQueueId =
                Number(tokenInfo.queue_id);

            currentTokenNumber =
                tokenInfo.token_number;

            currentCustomerName =
                tokenInfo.customer_name;

            currentQueueName =
                tokenInfo.queue_name || "";


            document.getElementById(
                "token-number"
            ).textContent =
                currentTokenNumber;


            document.getElementById(
                "customer-name"
            ).textContent =
                currentCustomerName || "";


            document.getElementById(
                "queue-name"
            ).textContent =
                currentQueueName;


            document.getElementById(
                "token-form"
            ).style.display =
                "none";


            document.getElementById(
                "token-result"
            ).style.display =
                "block";


            startLiveUpdates();

            return true;

        } catch (error) {

            console.error(
                "Saved token error:",
                error
            );

            clearSavedToken();

            return false;
        }
    }


    // ==========================================
    // LOAD QUEUES
    // ==========================================

    async function loadQueues() {

        const queueSelect =
            document.getElementById("queue");

        try {

            const response =
                await fetch(
                    "/api/queues?_=" + Date.now(),
                    {
                        cache: "no-store"
                    }
                );

            if (!response.ok) {
                throw new Error(
                    "Failed to load queues"
                );
            }

            const queues =
                await response.json();

            queueSelect.innerHTML = "";

            if (!queues.length) {

                queueSelect.innerHTML =
                    '<option value="">No active queues</option>';

                return;
            }


            const defaultOption =
                document.createElement("option");

            defaultOption.value = "";

            defaultOption.textContent =
                "Select a service queue";

            queueSelect.appendChild(
                defaultOption
            );


            queues.forEach(queue => {

                const option =
                    document.createElement("option");

                option.value =
                    queue.queue_id;

                option.textContent =
                    `${queue.branch_name} - ${queue.service_name}`;

                queueSelect.appendChild(
                    option
                );

            });

        } catch (error) {

            console.error(
                "Queue loading error:",
                error
            );

            queueSelect.innerHTML =
                '<option value="">Failed to load queues</option>';
        }
    }


    // ==========================================
    // UPDATE TOKEN
    // ==========================================

    async function updateTokenStatus() {

        if (
            !currentTokenId ||
            !currentQueueId
        ) {
            return;
        }

        try {

            // Get token status

            const tokenResponse =
                await fetch(
                    `/api/tokens/${currentTokenId}?_=${Date.now()}`,
                    {
                        cache: "no-store"
                    }
                );

            if (!tokenResponse.ok) {
                return;
            }

            const tokenData =
                await tokenResponse.json();


            // Get queue information

            const queueResponse =
                await fetch(
                    `/api/queues/${currentQueueId}?_=${Date.now()}`,
                    {
                        cache: "no-store"
                    }
                );

            if (!queueResponse.ok) {
                return;
            }

            const queueData =
                await queueResponse.json();


            // ==================================
            // UPDATE TOKEN
            // ==================================

            currentTokenNumber =
                tokenData.token_number;

            document.getElementById(
                "token-number"
            ).textContent =
                tokenData.token_number;


            // ==================================
            // UPDATE CUSTOMER NAME
            // ==================================

            if (tokenData.customer_name) {

                currentCustomerName =
                    tokenData.customer_name;

                document.getElementById(
                    "customer-name"
                ).textContent =
                    tokenData.customer_name;
            }


            // ==================================
            // UPDATE QUEUE NAME
            // ==================================

            currentQueueName =
                `${queueData.branch_name} - ${queueData.service_name}`;

            document.getElementById(
                "queue-name"
            ).textContent =
                currentQueueName;


            // ==================================
            // PEOPLE AHEAD
            // ==================================

            let peopleAhead = 0;

            const status =
                String(
                    tokenData.status || ""
                ).toLowerCase();


            if (status === "waiting") {

                const waitingTokens =
                    (queueData.tokens || [])
                        .filter(
                            token =>
                                String(
                                    token.status
                                ).toLowerCase() ===
                                "waiting"
                        );


                peopleAhead =
                    waitingTokens.filter(
                        token =>
                            Number(
                                token.token_number
                            ) <
                            Number(
                                tokenData.token_number
                            )
                    ).length;
            }


            // ==================================
            // ESTIMATED WAIT
            // ==================================

            const serviceTime =
                Number(
                    queueData.estimated_duration_minutes
                ) || 0;


            const estimatedWait =
                peopleAhead *
                serviceTime;


            document.getElementById(
                "people-ahead"
            ).textContent =
                peopleAhead;


            document.getElementById(
                "estimated-wait"
            ).textContent =
                estimatedWait;


            // ==================================
            // UPDATE STATUS
            // ==================================

            updateStatus(
                tokenData.status
            );


            // ==================================
            // SAVE LATEST TOKEN INFORMATION
            // ==================================

            saveToken();


            // ==================================
            // STOP POLLING AFTER FINAL STATE
            // ==================================

            if (
                status === "completed" ||
                status === "no_show" ||
                status === "no-show"
            ) {

                stopLiveUpdates();

            }

        } catch (error) {

            console.error(
                "Live update error:",
                error
            );
        }
    }


    // ==========================================
    // UPDATE STATUS DISPLAY
    // ==========================================

    function updateStatus(status) {

        const statusElement =
            document.getElementById(
                "queue-status"
            );

        const normalizedStatus =
            String(
                status || "waiting"
            ).toLowerCase();


        statusElement.className =
            "status";


        if (
            normalizedStatus === "called"
        ) {

            statusElement.textContent =
                "CALLED";

            statusElement.classList.add(
                "called"
            );

        }

        else if (
            normalizedStatus === "serving"
        ) {

            statusElement.textContent =
                "SERVING";

            statusElement.classList.add(
                "serving"
            );

        }

        else if (
            normalizedStatus === "completed"
        ) {

            statusElement.textContent =
                "COMPLETED";

            statusElement.classList.add(
                "completed"
            );

        }

        else if (
            normalizedStatus === "no_show" ||
            normalizedStatus === "no-show"
        ) {

            statusElement.textContent =
                "NO SHOW";

            statusElement.classList.add(
                "no-show"
            );

        }

        else {

            statusElement.textContent =
                "WAITING";
        }
    }


    // ==========================================
    // START LIVE UPDATES
    // ==========================================

    function startLiveUpdates() {

        stopLiveUpdates();

        // Update immediately
        updateTokenStatus();

        // Then every 2 seconds
        liveUpdateInterval =
            setInterval(
                updateTokenStatus,
                2000
            );
    }


    // ==========================================
    // STOP LIVE UPDATES
    // ==========================================

    function stopLiveUpdates() {

        if (liveUpdateInterval !== null) {

            clearInterval(
                liveUpdateInterval
            );

            liveUpdateInterval = null;
        }
    }


    // ==========================================
    // GET TOKEN
    // ==========================================

    document
        .getElementById("token-form")
        .addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                const name =
                    document.getElementById("name")
                        .value
                        .trim();


                const phone =
                    document.getElementById("phone")
                        .value
                        .trim();


                const queueId =
                    document.getElementById("queue")
                        .value;


                const button =
                    document.getElementById("submit-btn");


                const message =
                    document.getElementById("message");


                const result =
                    document.getElementById("token-result");


                // Validation

                if (
                    !name ||
                    !phone ||
                    !queueId
                ) {

                    message.className =
                        "message error";

                    message.textContent =
                        "Please fill all fields.";

                    return;
                }


                button.disabled = true;

                button.textContent =
                    "Creating Token...";


                message.className =
                    "message";

                message.textContent =
                    "";


                try {

                    // ==================================
                    // GET SELECTED QUEUE NAME
                    // ==================================

                    const queueSelect =
                        document.getElementById("queue");

                    const selectedOption =
                        queueSelect.options[
                            queueSelect.selectedIndex
                        ];

                    currentQueueName =
                        selectedOption.textContent;


                    // ==================================
                    // CREATE CUSTOMER + TOKEN
                    // ==================================

                    const response =
                        await fetch(
                            "/api/customer-token",
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body:
                                    JSON.stringify({
                                        full_name:
                                            name,

                                        phone:
                                            phone,

                                        email:
                                            null,

                                        queue_id:
                                            Number(queueId)
                                    })
                            }
                        );


                    const tokenData =
                        await response.json();


                    if (!response.ok) {

                        throw new Error(
                            tokenData.error ||
                            "Failed to create customer and issue token"
                        );
                    }


                    // ==================================
                    // SAVE CURRENT TOKEN
                    // ==================================

                    currentTokenId =
                        Number(
                            tokenData.token_id
                        );

                    currentQueueId =
                        Number(queueId);

                    currentTokenNumber =
                        tokenData.token_number;

                    currentCustomerName =
                        name;


                    saveToken();


                    // ==================================
                    // SHOW TOKEN
                    // ==================================

                    document.getElementById(
                        "token-number"
                    ).textContent =
                        tokenData.token_number;


                    document.getElementById(
                        "customer-name"
                    ).textContent =
                        name;


                    document.getElementById(
                        "queue-name"
                    ).textContent =
                        currentQueueName;


                    document.getElementById(
                        "token-form"
                    ).style.display =
                        "none";


                    result.style.display =
                        "block";


                    message.className =
                        "message success";


                    message.textContent =
                        `Token created successfully for ${name}.`;


                    // ==================================
                    // START LIVE TRACKING
                    // ==================================

                    startLiveUpdates();


                } catch (error) {

                    console.error(
                        "Token creation error:",
                        error
                    );

                    message.className =
                        "message error";

                    message.textContent =
                        error.message ||
                        "Something went wrong.";

                } finally {

                    button.disabled =
                        false;

                    button.textContent =
                        "Get Token";
                }

            }
        );


    // ==========================================
    // GET ANOTHER TOKEN
    // ==========================================

    document
        .getElementById("new-token-btn")
        .addEventListener(
            "click",
            function() {

                // Stop tracking
                stopLiveUpdates();


                // Clear saved token
                clearSavedToken();


                // Reset variables
                currentTokenId = null;
                currentQueueId = null;
                currentTokenNumber = null;
                currentCustomerName = null;
                currentQueueName = null;


                // Hide result
                document.getElementById(
                    "token-result"
                ).style.display =
                    "none";


                // Show form
                document.getElementById(
                    "token-form"
                ).style.display =
                    "block";


                // Reset form
                document.getElementById(
                    "token-form"
                ).reset();


                // Clear message
                document.getElementById(
                    "message"
                ).className =
                    "message";

                document.getElementById(
                    "message"
                ).textContent =
                    "";


                // Load queues
                loadQueues();
            }
        );


    // ==========================================
    // PAGE INITIALIZATION
    // ==========================================

    async function initializePage() {

        await loadQueues();

        const recovered =
            loadSavedToken();

        if (recovered) {

            console.log(
                "QueueX token recovered from browser."
            );
        }
    }


    initializePage();

</script>

</body>

</html>
